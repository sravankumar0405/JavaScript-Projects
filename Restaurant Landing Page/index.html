<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resto-websute Project Replicate</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="main">
        <div class="navbar">
            <div class="nav1">
                <div class="logo">CollegeResto</div>
                <ul class="nav-links">
                    <li>Home</li>
                    <li>Menu</li>
                    <li>About</li>
                    <li>Location</li>
                    <li>Contact</li>
                </ul>
            </div>
            <div class="icons">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>
        <div class="hero">
            <div class="left">
                <p class="left1">Are You Hungry?</p>
                <p class="left2">Don't Wait</p>
                <p class="left3">Let start to order food now</p>
                <span id="menuBtn">Check out Menu</span>
            </div>
            <div class="right">
                <img id="food" src="images/food.png" alt="pizza img" height="350px" width="350px">
            </div>
        </div>
        <div class="items">
            <div id="food1"></div>
            <div id="food2"></div>
            <div id="food3"></div>
            <div id="food4"></div>
        </div>
    </div>
    <!-- Load JS -->
     <script src="script.js"></script>
</body>
</html>
